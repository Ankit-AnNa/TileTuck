services:
  - type: web
    name: tiletuck-api
    env: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_ORIGINS
        value: https://tiletuck-frontend.vercel.app
      - key: PUBLIC_APP_URL
        value: https://tiletuck-frontend.vercel.app
